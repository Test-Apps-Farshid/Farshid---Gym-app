<script>
  window.APP_VERSION = "1.0.0";
  S.laden();
  App.thema();
  App.start();

  /* Service Worker: offline nutzbar, Updates ohne Datenverlust */
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("sw.js").then(reg => {
      const hinweis = (sw) => {
        const t = document.createElement("button");
        t.className = "toast an"; t.textContent = "Neue Version verfügbar – tippen zum Aktualisieren";
        t.onclick = () => { sw.postMessage("aktualisieren"); };
        document.body.appendChild(t);
      };
      if (reg.waiting && navigator.serviceWorker.controller) hinweis(reg.waiting);
      reg.addEventListener("updatefound", () => {
        const neu = reg.installing;
        neu.addEventListener("statechange", () => { if (neu.state === "installed" && navigator.serviceWorker.controller) hinweis(neu); });
      });
      // Bei jedem Öffnen nach Updates schauen
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
    });
    // Nur nach einem Update neu laden, nicht bei der ersten Installation
    const hatteController = !!navigator.serviceWorker.controller;
    let neuGeladen = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (hatteController && !neuGeladen) { neuGeladen = true; location.reload(); } });
  }
</script>
